name: Build Bambu Studio APK

on:
  push:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Android-Projekt direkt und ohne Gradle bauen
      run: |
        # 1. Tisch komplett freiräumen
        rm -rf app android build
        find . -maxdepth 1 -type f -not -name "README.md" -delete
        
        # 2. Saubere Ordnerstruktur für die APK anlegen
        mkdir -p app/src/main/res/values
        
        # 3. Das fehlerfreie Google-Standard-Manifest schreiben
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com"
            package="com.apkappentwickler.bambustudio">
            <application
                android:allowBackup="true"
                android:label="Bambu Studio Mobile"
                android:supportsRtl="true">
                <activity
                    android:name="com.apkappentwickler.bambustudio.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 4. Ressourcen-Datei schreiben
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Bambu Studio Mobile</string>
        </resources>
        EOF

        # 5. Die APK direkt mit dem integrierten Google-SDK-Werkzeug zusammenbauen
        # Wir holen uns das Werkzeug direkt über den absoluten Pfad des SDKs
        cd app/src/main
        $ANDROID_HOME/build-tools/34.0.0/aapt2 compile res/values/strings.xml -o compiled_res.zip || true
        $ANDROID_HOME/build-tools/34.0.0/aapt2 link --manifest AndroidManifest.xml -I $ANDROID_HOME/platforms/android-34/android.jar -o ../../../BambuStudio-Mobile.apk

    - name: Fertige APK als Download bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: BambuStudio-App
        path: BambuStudio-Mobile.apk
