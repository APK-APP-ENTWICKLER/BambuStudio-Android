name: Build Bambu Studio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Java 17 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Android-Projekt per Autopilot erzeugen
      run: |
        # Hier werden alle Ordner absolut fehlerfrei angelegt
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/java/com/apkappentwickler/bambustudio
        
        # 1. Manifest erstellen
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <application android:label="Bambu Studio Mobile" android:allowBackup="true" android:supportsRtl="true">
                <activity android:name="com.apkappentwickler.bambustudio.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. Ressourcen-Strings erstellen
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Bambu Studio Mobile</string>
        </resources>
        EOF

        # 3. Java-Hauptdatei erstellen
        cat << 'EOF' > app/src/main/java/com/apkappentwickler/bambustudio/MainActivity.java
        package com.apkappentwickler.bambustudio;
        import android.app.Activity;
        import android.os.Bundle;
        import android.widget.TextView;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                TextView tv = new TextView(this);
                tv.setText("Bambu Studio Mobile: App erfolgreich gestartet!");
                tv.setTextSize(24);
                setContentView(tv);
            }
        }
        EOF

        # 4. Gradle-Konfigurationsdateien erzeugen
        cat << 'EOF' > settings.gradle
        rootProject.name = "BambuStudioAndroid"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.apkappentwickler.bambustudio'
            compileSdk 34
            defaultConfig {
                applicationId "com.apkappentwickler.bambustudio"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

    - name: Android SDK bereitstellen
      uses: android-actions/setup-android@v3

    - name: APK mit Gradle kompilieren
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Fertige APK als Download bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: BambuStudio-App
        path: app/build/outputs/apk/debug/app-debug.apk
