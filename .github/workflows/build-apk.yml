name: Build Bambu Studio APK

on:
  push:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Android-Projekt für den Gradle-Build erzeugen
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app build obj gradle gradlew gradlew.bat \
            settings.gradle build.gradle BambuStudio-Mobile.apk

          mkdir -p app/src/main/java/com/apkappentwickler/bambustudio
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/jniLibs/arm64-v8a

          cat > settings.gradle <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'BambuStudio-Android'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.apkappentwickler.bambustudio'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.apkappentwickler.bambustudio'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'

                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.apkappentwickler.bambustudio">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Bambu Studio Mobile</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:colorAccent">#00AEEC</item>
                  <item name="android:navigationBarColor">#101419</item>
                  <item name="android:statusBarColor">#101419</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/apkappentwickler/bambustudio/MainActivity.java <<'EOF'
          package com.apkappentwickler.bambustudio;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int PICK_MODEL_REQUEST = 42;
              private static final int BG = Color.rgb(16, 20, 25);
              private static final int SURFACE = Color.rgb(28, 34, 41);
              private static final int TEXT = Color.rgb(242, 245, 247);
              private static final int MUTED = Color.rgb(156, 169, 179);
              private static final int CYAN = Color.rgb(0, 174, 236);

              static {
                  System.loadLibrary("bambustudio_core");
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  setContentView(createContentView());
              }

              private View createContentView() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(28), dp(22), dp(28), dp(24));

                  LinearLayout toolbar = new LinearLayout(this);
                  toolbar.setGravity(Gravity.CENTER_VERTICAL);

                  TextView mark = label("B", 24, CYAN);
                  mark.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  mark.setGravity(Gravity.CENTER);
                  mark.setBackground(round(CYAN, 12));
                  toolbar.addView(mark, new LinearLayout.LayoutParams(dp(48), dp(48)));

                  TextView brand = label("  Bambu Studio", 21, TEXT);
                  brand.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  toolbar.addView(brand, new LinearLayout.LayoutParams(0, dp(48), 1));

                  TextView version = label("MOBILE", 11, MUTED);
                  version.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  toolbar.addView(version);

                  root.addView(toolbar, new LinearLayout.LayoutParams(-1, dp(56)));

                  TextView heading = label("Bereit für dein nächstes\n3D-Projekt?", 32, TEXT);
                  heading.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  heading.setPadding(0, dp(22), 0, dp(8));
                  root.addView(heading);

                  TextView intro = label("Lade ein Modell und starte den Slicing-Workflow.", 16, MUTED);
                  intro.setPadding(0, dp(14), 0, dp(26));
                  root.addView(intro);

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(20), dp(20), dp(20), dp(20));
                  card.setBackground(round(SURFACE, 18));

                  TextView cardTitle = label("MODELL IMPORTIEREN", 12, CYAN);
                  cardTitle.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  card.addView(cardTitle);

                  TextView hint = label("Unterstützte Formate: STL und 3MF", 14, MUTED);
                  hint.setPadding(0, dp(8), 0, dp(18));
                  card.addView(hint);

                  Button load = new Button(this);
                  load.setAllCaps(false);
                  load.setText("3D-Modell für Slicing laden (.stl/.3mf)");
                  load.setTextColor(Color.WHITE);
                  load.setTextSize(16);
                  load.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  load.setGravity(Gravity.CENTER);
                  load.setMinHeight(dp(58));
                  load.setPadding(dp(12), 0, dp(12), 0);
                  load.setBackground(round(CYAN, 12));
                  load.setOnClickListener(v -> openModelPicker());

                  card.addView(load, new LinearLayout.LayoutParams(-1, dp(58)));
                  root.addView(card, new LinearLayout.LayoutParams(-1, ViewGroup.LayoutParams.WRAP_CONTENT));

                  TextView footer = label("Bambu Studio Core  •  Bereit", 13, MUTED);
                  footer.setGravity(Gravity.CENTER);
                  footer.setPadding(0, dp(26), 0, 0);
                  root.addView(footer);

                  return root;
              }

              private void openModelPicker() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");
                  intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[] {
                          "model/stl",
                          "application/vnd.ms-pki.stl",
                          "model/3mf",
                          "application/vnd.ms-package.3dmanufacturing-3dmodel",
                          "application/octet-stream"
                  });

                  startActivityForResult(
                          Intent.createChooser(intent, "3D-Modell auswählen"),
                          PICK_MODEL_REQUEST
                  );
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == PICK_MODEL_REQUEST
                          && resultCode == RESULT_OK
                          && data != null) {
                      Uri model = data.getData();

                      if (model != null) {
                          Toast.makeText(
                                  this,
                                  "Modell geladen: " + model.getLastPathSegment(),
                                  Toast.LENGTH_LONG
                          ).show();
                      }
                  }
              }

              private TextView label(String text, int size, int color) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  return view;
              }

              private GradientDrawable round(int color, int radius) {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setColor(color);
                  drawable.setCornerRadius(dp(radius));
                  return drawable;
              }

              private int dp(int value) {
                  return Math.round(
                          value * getResources().getDisplayMetrics().density
                  );
              }
          }
          EOF

      - name: Gradle Wrapper erzeugen
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x ./gradlew

      - name: Native-Bibliothek für arm64-v8a bereitstellen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/jniLibs/arm64-v8a

          NATIVE_LIBRARY="$(find . \
            -path './app/src/main/jniLibs/arm64-v8a/libbambustudio_core.so' -prune -o \
            -type f \
            -name 'libbambustudio_core.so' \
            -print \
            | head -n 1)"

          if [ -z "${NATIVE_LIBRARY}" ]; then
            echo "::error::libbambustudio_core.so wurde im Repository nicht gefunden."
            exit 1
          fi

          cp "${NATIVE_LIBRARY}" \
            app/src/main/jniLibs/arm64-v8a/libbambustudio_core.so

          test -s app/src/main/jniLibs/arm64-v8a/libbambustudio_core.so

          file app/src/main/jniLibs/arm64-v8a/libbambustudio_core.so

      - name: Debug-APK mit Gradle bauen
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: APK mit jar prüfen
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "${APK}"
          jar tf "${APK}" > apk-contents.txt

          grep -q "lib/arm64-v8a/libbambustudio_core.so" apk-contents.txt

      - name: Android Build-Tools ermitteln
        id: build-tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$(
            find "${ANDROID_SDK_ROOT}/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "${BUILD_TOOLS_DIR}" ]; then
            echo "::error::Keine Android Build-Tools gefunden."
            exit 1
          fi

          echo "dir=${BUILD_TOOLS_DIR}" >> "${GITHUB_OUTPUT}"

      - name: APK mit zipalign ausrichten
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED_APK="app/build/outputs/apk/debug/app-debug-aligned.apk"

          "${{ steps.build-tools.outputs.dir }}/zipalign" \
            -f \
            -p \
            4 \
            "${APK}" \
            "${ALIGNED_APK}"

          "${{ steps.build-tools.outputs.dir }}/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            "${ALIGNED_APK}"

      - name: APK neu signieren
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED_APK="app/build/outputs/apk/debug/app-debug-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/debug/BambuStudio-App.apk"
          DEBUG_KEYSTORE="${HOME}/.android/debug.keystore"

          if [ ! -f "${DEBUG_KEYSTORE}" ]; then
            mkdir -p "${HOME}/.android"

            keytool \
              -genkeypair \
              -v \
              -noprompt \
              -keystore "${DEBUG_KEYSTORE}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          "${{ steps.build-tools.outputs.dir }}/apksigner" sign \
            --ks "${DEBUG_KEYSTORE}" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"

          "${{ steps.build-tools.outputs.dir }}/apksigner" verify \
            --verbose \
            "${SIGNED_APK}"

      - name: Fertige APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: BambuStudio-App
          path: app/build/outputs/apk/debug/BambuStudio-App.apk
          if-no-files-found: error
