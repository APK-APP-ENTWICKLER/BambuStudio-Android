name: Build Bambu Studio APK

on:
  push:
    branches: [ main, hauptsaechlich ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Java 17 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: App-Projektstruktur aufbauen
      run: |
        # 1. Erstellt die exakten Ordner
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/java/com/apkappentwickler/bambustudio
        
        # 2. Schreibt das perfekte Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com"
            package="com.apkappentwickler.bambustudio">
            <application android:label="Bambu Studio Mobile" android:allowBackup="true" android:supportsRtl="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 3. Erstellt die Ressourcen-Datei
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Bambu Studio Mobile</string>
        </resources>
        EOF

        # 4. Erstellt die Java-Startdatei
        cat << 'EOF' > app/src/main/java/com/apkappentwickler/bambustudio/MainActivity.java
        package com.apkappentwickler.bambustudio;
        import android.app.Activity;
        import android.os.Bundle;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
            }
        }
        EOF

        # 5. Schreibt die modernen Gradle-Dateien
        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "BambuStudioAndroid"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins { id 'com.android.application' version '8.2.0' apply false }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.apkappentwickler.bambustudio'
            compileSdk 34
            defaultConfig {
                applicationId "com.apkappentwickler.bambustudio"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

    - name: APK mit modernem Gradle-Wrapper bauen
      run: |
        # Dieser Befehl lädt automatisch das perfekte, fehlerfreie Gradle-System herunter!
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Fertige APK als Download bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: BambuStudio-App
        path: app/build/outputs/apk/debug/app-debug.apk
