name: Build Bambu Studio APK

on:
  push:
    branches: [ main, hauptsaechlich ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Java 17 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: App-Projektstruktur aufbauen
      run: |
        # 1. Erstellt die exakten Ordner, die Android erwartet
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/java/com/apkappentwickler/bambustudio
        mkdir -p app/src/main/jniLibs/arm64-v8a
        
        # 2. Verschiebt deine vorhin hochgeladenen Originaldateien an die richtige Stelle
        cp AndroidManifest.xml app/src/main/
        cp native-lib.cpp app/src/main/java/com/apkappentwickler/bambustudio/

        # 3. Erstellt eine saubere, fehlerfreie Ressourcen-Datei
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Bambu Studio Mobile</string>
        </resources>
        EOF

        # 4. Erstellt die Java-Startdatei, die auch deine C++ Datei einbindet
        cat << 'EOF' > app/src/main/java/com/apkappentwickler/bambustudio/MainActivity.java
        package com.apkappentwickler.bambustudio;
        import android.app.Activity;
        import android.os.Bundle;
        import android.widget.TextView;
        public class MainActivity extends Activity {
            static {
                System.loadLibrary("bambustudio_core");
            }
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                TextView tv = new TextView(this);
                tv.setText("Bambu Studio Mobile: Core geladen!");
                setContentView(tv);
            }
        }
        EOF

        # 5. Schreibt die Gradle-Dateien absolut fehlerfrei
        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "BambuStudioAndroid"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins { id 'com.android.application' version '8.2.0' apply false }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.apkappentwickler.bambustudio'
            compileSdk 34
            defaultConfig {
                applicationId "com.apkappentwickler.bambustudio"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

    - name: APK mit vorinstalliertem Gradle bauen
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        gradle assembleDebug

    - name: Fertige APK als Download bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: BambuStudio-App
        path: app/build/outputs/apk/debug/app-debug.apk
